[mgr]
prepend_keymap = [
  { on = "h", run = "leave", desc = "Back to the parent directory" },
  { on = "t", run = "arrow next", desc = "Next line" },
  { on = "n", run = "arrow prev", desc = "Previous line" },
  { on = "s", run = "enter", desc = "Enter the child directory" },
  { on = "T", run = "plugin parent-arrow 1", desc = "Next parent" },
  { on = "N", run = "plugin parent-arrow -1", desc = "Previous parent" },
  { on = "x", run = 'shell "$SHELL" --block', desc = "Open $SHELL here" },
  { on = "q", run = "close", desc = "Close the current tab" },
  { on = "y", run = ['shell -- for path in %s; do echo "$path "; done | wl-copy -t text/uri-list', "yank"], desc = "Copy" },
  { on = ["g", "r"], run = 'shell -- ya emit cd "$(git rev-parse --show-toplevel)"', desc = "Go to git root directory" },
  { on = "S", run = "plugin toggle-pane max-preview", desc = "Maximize or restore the preview pane" },
  { on = "f", run = "plugin jump-to-char", desc = "Jump to char" },
  { on = "m", run = "plugin bookmarks save", desc = "Save current position as a bookmark" },
  { on = "'", run = "plugin bookmarks jump", desc = "Jump to a bookmark" },
]
