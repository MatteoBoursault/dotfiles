[bar.default]
center = [ "notifications", "clock", "clipboard" ]
end = [ "tray", "network", "bluetooth", "volume", "brightness", "battery" ]
margin_ends = 0
panel_overlap = 0
radius = 0
start = [ "session", "control-center", "workspaces", "launcher" ]

[desktop_widgets]
schema_version = 2
widget_order = []

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget]

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@eDP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 768.0
    cy = 682.0
    output = "eDP-1"
    placement_height = 864.0
    placement_width = 1536.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[shell]
corner_radius_scale = 0.0
polkit_agent = true

[theme]
builtin = "Kanagawa"
community_palette = "Oxocarbon"
mode = "dark"
source = "builtin"
wallpaper_scheme = "m3-content"

    [theme.templates]
    builtin_ids = [ "kitty", "niri", "qt" ]

[wallpaper]
directory = "/home/matteo/Images/wallpaper"

    [wallpaper.default]
    path = "/home/matteo/Images/wallpaper/storm.jpg"

    [wallpaper.last]
    path = "/home/matteo/Images/wallpaper/storm.jpg"

    [wallpaper.monitors.eDP-1]
    path = "/home/matteo/Images/wallpaper/storm.jpg"
