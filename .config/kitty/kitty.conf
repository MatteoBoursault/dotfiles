include ~/.config/kitty/theme.conf

# ==============================================================================
# BEHAVIOUR
# ==============================================================================

scrollback_lines        10000
confirm_os_window_close 0
shell_integration       enabled

# Désactiver la souris
mouse_hide_wait         0
click_interval          -1.0
focus_follows_mouse     no

# Notification quand une commande longue finit en arrière-plan
notify_on_cmd_finish unfocused 10.0

# ==============================================================================
# TABS
# ==============================================================================

tab_bar_style           powerline
tab_powerline_style     slanted
tab_title_template      "{index}: {title}"

# ==============================================================================
# CLIPBOARD
# ==============================================================================

map ctrl+y copy_and_clear_or_interrupt
map ctrl+p paste_from_clipboard

# ==============================================================================
# NAVIGATION — convention DVP : h=gauche  t=bas  n=haut  s=droite
# ==============================================================================

# --- Fenêtres (splits) ---
enabled_layouts splits
map ctrl+shift+v launch --location=vsplit --cwd=current
map ctrl+shift+b launch --location=hsplit --cwd=current
map ctrl+shift+q close_window

# Focus pane
action_alias move launch --type background --allow-remote-control ~/.config/kitty/kitty_smart_move.sh @active-kitty-window-id
map ctrl+h move left
map ctrl+t move bottom
map ctrl+n move top
map ctrl+s move right

# Resize pane
map ctrl+shift+h move narrower
map ctrl+shift+t move shorter
map ctrl+shift+n move taller
map ctrl+shift+s move wider

# --- Onglets ---
map ctrl+shift+a previous_tab
map ctrl+shift+o new_tab_with_cwd
map ctrl+shift+e close_tab
map ctrl+shift+u next_tab

# Renommer l'onglet courant
map ctrl+shift+r set_tab_title

# --- Scrollback ---
map alt+p scroll_to_prompt -1
map alt+l scroll_to_prompt 1

# ==============================================================================
# TERMINAL BUFFER
# ==============================================================================

scrollback_pager nvim --cmd 'set eventignore=FileType' +'nnoremap q ZQ' +'call nvim_open_term(0, {})' +'set nomodified nolist' +'$' -
map ctrl+x show_scrollback

# Ouvrir les URLs visibles au clavier (hints kitten)
map alt+u kitten hints --type url

# Copier un path visible dans le terminal
map alt+p kitten hints --type path --program @

# Copier un hash git visible
map alt+h kitten hints --type hash --program @
