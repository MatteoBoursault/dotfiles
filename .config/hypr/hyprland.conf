source = ~/.config/hypr/theme.conf
$keymaps_conf_file = dvp.conf
source = ~/.config/hypr/keymaps/$keymaps_conf_file
shell = /usr/bin/bash

################
### MONITORS ###
################

monitor=,preferred,auto,auto

###################
### MY PROGRAMS ###
###################

$menu = wofi --show drun
$terminal = kitty
$navigator = firefox
$fileManager = $terminal --detach nu -i -c "yazi"
$passwordManager = keepassxc

#################
### AUTOSTART ###
#################

exec-once = hyprpaper

workspace = special:passwordManagerWorkspace, on-created-empty:$passwordManager
workspace = special:navigatorWorkspace, on-created-empty:$navigator
workspace = special:terminalWorkspace, on-created-empty:$terminal
workspace = special:fileManagerWorkspace, on-created-empty:$fileManager

#############################
### ENVIRONMENT VARIABLES ###
#############################

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = EDITOR,nvim

#####################
### LOOK AND FEEL ###
#####################

general {
    gaps_in = 0
    gaps_out = 0
    border_size = 1
    col.active_border = $base0E
    resize_on_border = false
    allow_tearing = false
}

decoration {
    active_opacity = 1.0
    inactive_opacity = 0.8
}

animations {
    enabled = false
}

misc {
    disable_hyprland_logo = true
    force_default_wallpaper = 0
    background_color = $base00
}

#############
### INPUT ###
#############

input {
    kb_layout = $kayboard_layout
    kb_variant = $kayboard_variant
    kb_model =
    kb_options =
    kb_rules =
    follow_mouse = 1
    sensitivity = 0
    touchpad {
        natural_scroll = false
    }
}

###################
### KEYBINDINGS ###
###################

$mainMod = SUPER

bind = $mainMod, C, killactive,
bind = $mainMod, G, exec, command -v hyprshutdown >/dev/null 2>&1 && hyprshutdown || hyprctl dispatch exit
bind = $mainMod, R, exec, $menu

# Move focus with mainMod + arrow keys
bind = $mainMod, $left_key, movefocus, l
bind = $mainMod, $right_key, movefocus, r
bind = $mainMod, $up_key, movefocus, u
bind = $mainMod, $down_key, movefocus, d

# Switch workspace/monitor with mainMod + CTRL + arrow keys
bind = $mainMod CTRL, $up_key, workspace, r+1
bind = $mainMod CTRL, $down_key, workspace, r-1
bind = $mainMod CTRL, $right_key, focusmonitor, +1
bind = $mainMod CTRL, $left_key, focusmonitor, -1

# Move active window to workspace/monitor with mainMod + SHIFT + arrow keys
bind = $mainMod SHIFT, $up_key, movetoworkspace, r+1
bind = $mainMod SHIFT, $down_key, movetoworkspace, r-1
bind = $mainMod SHIFT, $right_key, movewindow, mon:+1
bind = $mainMod SHIFT, $left_key, movewindow, mon:-1

# Switch to special workspace
bind = $mainMod, $one_key, togglespecialworkspace, terminalWorkspace
bind = $mainMod, $two_key, togglespecialworkspace, fileManagerWorkspace
bind = $mainMod, $three_key, togglespecialworkspace, passwordManagerWorkspace
bind = $mainMod, $four_key, togglespecialworkspace, navigatorWorkspace

# Laptop multimedia keys for volume and LCD brightness
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-

# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

##############################
### WINDOWS AND WORKSPACES ###
##############################

windowrule {
    name = specialWorkspace
    match:workspace = s[true]
    border_color = $base0B
}

windowrule {
    # Ignore maximize requests from all apps
    name = suppress-maximize-events
    match:class = .*
    suppress_event = maximize
}

windowrule {
    # Fix some dragging issues with XWayland
    name = fix-xwayland-drags
    match:class = ^$
    match:title = ^$
    match:xwayland = true
    match:float = true
    match:fullscreen = false
    match:pin = false
    no_focus = true
}

windowrule {
    name = move-hyprland-run
    match:class = hyprland-run
    move = 20 monitor_h-120
    float = yes
}

windowrule {
    name = resize_popup_window
    match:title = ^(Ouvrir).*
    float = on
    size = 800 600
}
